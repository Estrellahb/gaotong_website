<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin 页面</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f7fa;
      color: #222;
    }
    .admin-shell {
      text-align: center;
      padding: 36px 28px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    }
    .admin-title {
      margin: 0 0 12px;
      font-size: 28px;
      color: #1b1f3b;
    }
    .admin-subtitle {
      margin: 0;
      color: #5f6a82;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <h1 class="admin-title">我是admin</h1>
    <p class="admin-subtitle">此页面已独立到 admin 文件夹中。</p>
  </div>
</body>
</html>
