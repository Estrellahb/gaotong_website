<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高瞳县政务信息公开平台 - 登录</title>
  <link rel="stylesheet" href="../style.css?v=20260516-3" />
</head>
<body class="login-page" data-page="login">
  <main class="login-shell compact">
    <section class="login-card">
      <div class="login-mark">政务</div>
      <h1 class="login-title">高瞳县政务信息公开平台</h1>
      <p class="login-subtitle">请使用授权账号登录系统</p>
      <form id="loginForm" class="login-form">
        <div>
          <label class="login-label" for="username">用户名</label>
          <input id="username" class="login-input" type="text" autocomplete="username" placeholder="请输入用户名" />
        </div>
        <div>
          <label class="login-label" for="password">密码</label>
          <input id="password" class="login-input" type="password" autocomplete="current-password" placeholder="请输入密码" />
        </div>
        <button class="login-submit" type="submit">登录</button>
        <div id="loginError" class="login-error" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script src="../app.js?v=20260516-3"></script>
</body>
</html>
